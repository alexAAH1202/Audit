<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premises Access Audit — Inclusive Access Co.</title>
<style>
:root{
  --ink:#1B1E2B; --muted:#4A4E5C; --line:#D3D6E0; --bg:#F9FAFC; --card:#fff;
  --brand:#283593; --brand-lt:#E7E6F5;
  --green:#1E6B3C; --green-bg:#E9F5EC;
  --red:#B3261E; --red-bg:#FCEBEA;
  --orange:#8A5A00; --orange-bg:#FDF6E7;
  --breach:#6B0F1A; --breach-bg:#F4DFE1;
}
*{box-sizing:border-box;margin:0}
body{font-family:Arial,Helvetica,"Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.45}
.side .logo h1,.pg h2,.card h3,.divpage h2,.rep .rh h4,.top .stat b{font-family:Verdana,Geneva,sans-serif}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.app{display:flex;height:100vh;overflow:hidden}
/* ---------- sidebar ---------- */
.side{width:290px;min-width:290px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side .logo{padding:16px 18px;border-bottom:1px solid var(--line)}
.side .logo h1{font-size:15px;color:var(--brand)}
.side .logo small{color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:6px 0}
.nav .div{padding:12px 18px 4px;font-size:11px;letter-spacing:.12em;color:var(--brand);font-weight:700}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;color:var(--ink);text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--brand-lt);border-left-color:var(--brand);font-weight:600}
.nav a .sc{font-size:11px;color:var(--muted);white-space:nowrap}
.nav a .sc.bad{color:var(--red);font-weight:700}
.side .foot{border-top:1px solid var(--line);padding:12px 18px;font-size:12px;color:var(--muted)}
/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
.top .stat b{font-size:15px}
.top .stat.flag b{color:var(--red)}
.top .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-size:13.5px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--red)}
.content{flex:1;overflow-y:auto;padding:26px 30px 80px}
.pg{max-width:880px;margin:0 auto}
.pg h2{font-size:21px;margin-bottom:2px}
.pg .crumb{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:12px;color:var(--brand)}
.card h3 .cnt{color:var(--muted);font-weight:400;font-size:12.5px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.field label .req{color:var(--red)}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=datetime-local],.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff}
.field textarea{min-height:72px;resize:vertical}
.chk{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13.5px}
.chk input{margin-top:3px}
/* question rows */
.qrow{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:none}
.qrow .qt{flex:1;font-size:13.5px}
.qrow .qt .cl{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.opts{display:flex;gap:5px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
.opt.g.on{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:700}
.opt.r.on{background:var(--red-bg);border-color:var(--red);color:var(--red);font-weight:700}
.opt.o.on{background:var(--orange-bg);border-color:var(--orange);color:var(--orange);font-weight:700}
.opt.n.on{background:var(--brand-lt);border-color:var(--brand);color:var(--brand);font-weight:700}
.opt.b.on{background:var(--breach-bg);border-color:var(--breach);color:var(--breach);font-weight:700}
.qnote-lbl{display:block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--brand);text-transform:uppercase}
/* per-item photos */
.addphoto{display:inline-flex;align-items:center;gap:5px;margin-top:7px;border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:6px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:36px}
.addphoto:hover{background:var(--brand-lt)}
.qphotos{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.qphoto{position:relative;width:74px;height:74px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#eef}
.qphoto img{width:100%;height:100%;object-fit:cover;display:block}
.qphoto a.view{position:absolute;inset:0}
.qphoto button{position:absolute;top:2px;right:2px;width:20px;height:20px;line-height:1;border:none;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:12px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.qphoto button:hover{background:var(--red)}
.qnote{width:100%;margin-top:3px;border:1px dashed var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px;display:block;min-height:40px;background:#fff}
.qnote.show{display:block}
.addl input{width:100%;border:none;border-bottom:1px dashed var(--line);padding:4px 2px;font-size:13.5px;font-style:italic;background:transparent}
/* repeat sections */
.rep{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;margin-bottom:14px;background:var(--card)}
.rep .rh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--brand-lt);border-radius:8px 8px 0 0}
.rep .rh h4{font-size:14px;color:var(--brand)}
.rep .rb{padding:14px 18px}
.addrep{margin:4px 0 18px}
.inst{background:var(--bg);border-left:4px solid var(--brand);border-radius:8px;padding:14px 16px;font-size:13px;color:#3a4453;white-space:pre-wrap;margin-bottom:14px}
.stub{border:1px dashed var(--orange);background:var(--orange-bg);border-radius:8px;padding:14px 16px;font-size:13px;margin-bottom:14px}
.pgnav{display:flex;justify-content:space-between;margin-top:26px}
.divpage{text-align:center;padding:70px 20px}
.divpage h2{font-size:34px;letter-spacing:.2em;color:var(--brand)}
.divpage p{color:var(--muted);max-width:520px;margin:14px auto 0}
.sig{border:1px solid var(--line);border-radius:8px;background:#fff}
/* report */
.rep-table{width:100%;border-collapse:collapse;font-size:13px}
.rep-table th,.rep-table td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.rep-table th{background:var(--bg)}
.flagitem{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:11px 14px;margin-bottom:9px;font-size:13px}
.flagitem.med{border-left-color:var(--orange)}
.flagitem.breach{border-left-color:var(--breach)}
.flagitem .fp{color:var(--muted);font-size:11.5px}
.badge{display:inline-block;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:700}
.badge.hi{background:var(--red-bg);color:var(--red)}
.badge.md,.badge.lo{background:var(--orange-bg);color:var(--orange)}
.badge.br{background:var(--breach-bg);color:var(--breach)}
/* report: flagged items grouped under a priority heading */
.flag-group{margin-bottom:16px}
.flag-group:last-child{margin-bottom:0}
.flag-group h4{font-size:14px;margin-bottom:8px}
.flag-group h4 .cnt{font-weight:400}
.flag-group h4.br{color:var(--breach)}
.flag-group h4.hi{color:var(--red)}
.flag-group h4.md,.flag-group h4.lo{color:var(--orange)}
/* report: per-item remediation timeframe */
.tf-row{margin-top:8px}
.tf-label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.tf-select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px;color:var(--ink);background:#fff;min-height:36px}
.tf-select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
/* hamburger — hidden on desktop, shown on mobile */
.btn.menu{display:none;align-items:center;gap:6px}
.backdrop{display:none}
@media print{
  .side,.top,.pgnav,.noprint,.btn.menu,.backdrop{display:none!important}
  .app{display:block;height:auto}
  .content{overflow:visible;padding:0}
  body{background:#fff}
}
/* ---------- responsive / mobile ---------- */
@media (max-width:820px){
  .app{flex-direction:column}
  .btn.menu{display:inline-flex}
  /* sidebar becomes an off-canvas drawer */
  .side{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:320px;z-index:60;
        transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 30px rgba(0,0,0,.28)}
  .side.open{transform:translateX(0)}
  .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:55;
            opacity:0;visibility:hidden;transition:opacity .22s ease}
  .backdrop.show{opacity:1;visibility:visible}
  .main{flex:1;min-height:0}
  .top{padding:8px 14px;gap:8px}
  .top .stat{padding:5px 9px;font-size:12px}
  .top .stat b{font-size:13px}
  .content{padding:18px 15px 90px}
  .pg h2{font-size:19px}
  .qrow{flex-direction:column;gap:8px}
  .qrow .opts{width:100%}
  .opt{flex:1;text-align:center}
}
@media (max-width:480px){
  .top .grow{display:none}
  .top{justify-content:flex-start}
  .side{width:88%}
}
@media (prefers-reduced-motion:reduce){
  .side,.backdrop{transition:none}
}
/* =====================================================================
   REPORT v2 — styles. Paste at the END of the existing <style> block.
   Reuses your variables; adds no new colour decisions beyond the
   four-step scheduling ramp.
===================================================================== */
.report2{--z1:#104281;--z2:#256abf;--z3:#5598e7;--z4:#b7d3f6}
.report2 h4.secbreak{font-family:Verdana,Geneva,sans-serif;font-size:13px;color:var(--brand);
  margin:18px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line);letter-spacing:.03em}
.report2 h4.secbreak:first-of-type{margin-top:4px}
.rf-hint{color:var(--muted);font-size:12.5px;max-width:72ch;margin-bottom:12px}
.rf-note{margin-top:6px;font-size:13px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.tile .tl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .statv{font-family:Verdana,Geneva,sans-serif;font-size:27px;line-height:1.15;margin-top:4px;display:block}
.tile .tn{font-size:12px;color:var(--muted);margin-top:3px;display:block}
.tile.c-red .statv{color:var(--red)}
.tile.c-breach .statv{color:var(--breach)}
.tile.c-orange .statv{color:var(--orange)}
/* matrix */
.mx{width:100%;border-collapse:separate;border-spacing:3px}
.mx th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;
  padding:5px 7px;text-align:left}
.mx th.ch{text-align:center}
.mx td{padding:0}
.mx td button{width:100%;border:2px solid transparent;background:transparent;padding:12px 6px;
  border-radius:7px;cursor:pointer;display:block;color:inherit;font:inherit}
.mx td button.sel{border-color:var(--ink)}
.mx td button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mx .n{font-family:Verdana,Geneva,sans-serif;font-size:20px;font-weight:700;display:block;line-height:1.1}
.mx .zl{font-size:10px;letter-spacing:.04em;text-transform:uppercase;display:block;margin-top:2px;opacity:.9}
/* Zone fills. On matrix buttons they must beat `.mx td button`
   (background:transparent;color:inherit), hence the extra selector. */
.z1,.mx td button.z1{background:var(--z1);color:#fff}.z2,.mx td button.z2{background:var(--z2);color:#fff}
.z3,.mx td button.z3{background:var(--z3);color:#0b0b0b}.z4,.mx td button.z4{background:var(--z4);color:#0b0b0b}
.zempty,.mx td button.zempty{background:#F1F2F6;color:#9A9DA8}
.mxlegend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.mxlegend span{display:flex;align-items:center;gap:6px}
.sw{width:13px;height:13px;border-radius:3px;flex:none}
/* journey */
.jrn{display:flex;flex-direction:column}
.jstage{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.jstage:first-child{border-top:none}
.jrail{flex:none;width:26px;display:flex;flex-direction:column;align-items:center;align-self:stretch}
.jdot{width:14px;height:14px;border-radius:50%;flex:none;border:3px solid var(--card);box-shadow:0 0 0 1.5px currentColor}
.jline{flex:1;width:2px;background:var(--line);margin-top:3px;min-height:10px}
.jstage:last-child .jline{display:none}
.jname{font-weight:700;font-size:14px;font-family:Verdana,Geneva,sans-serif}
.jmeta{font-size:12.5px;color:var(--muted);margin-top:1px}
.jchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:11.5px;border-radius:5px;padding:2px 8px;font-weight:700;white-space:nowrap}
.chip.b{background:var(--breach-bg);color:var(--breach)}
.chip.h{background:var(--red-bg);color:var(--red)}
.chip.m{background:var(--orange-bg);color:var(--orange)}
.chip.p{background:var(--green-bg);color:var(--green)}
/* report-time prose fields */
.rf{margin-top:9px}
.rf-l{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--brand);font-weight:700;margin-bottom:3px}
.rf-t{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;
  font-size:13px;background:#fff;color:var(--ink);resize:vertical;min-height:42px}
.rf-t.pos{min-height:92px;font-size:14px}
/* Data-durability notices (Phase 1). Text carries the meaning; colour only
   reinforces it. */
.notice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 16px;font-size:13.5px;
  border-bottom:1px solid var(--line);background:var(--orange-bg);color:var(--ink)}
.notice.err{background:var(--red-bg)}
.notice.ok{background:var(--green-bg)}
.notice b{color:var(--orange)}.notice.err b{color:var(--red)}.notice.ok b{color:var(--green)}
.notice .btn{min-height:44px}
.resetdlg{margin:auto;border:none;border-radius:12px;padding:22px;max-width:480px;width:92%;color:var(--ink)}
.resetdlg::backdrop{background:rgba(20,30,45,.5)}
.resetdlg h3{margin-bottom:10px;color:var(--red)}.resetdlg p{margin-bottom:10px}
.resetdlg label{display:block;margin:14px 0 6px}.resetdlg .ein{width:100%}
.resetdlg .rsact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.resetdlg .btn[disabled]{opacity:.5;cursor:not-allowed}
.notice .nx{margin-left:auto;min-height:44px;min-width:44px}
@media print{#notices{display:none}}
.notice>span{flex:1 1 0;min-width:0}.notice{flex-wrap:nowrap}
/* Narrow screens: the bar keeps Sections, the three stats, Report view and a More menu;
   every other action lives in the menu so questions start near the top of the screen. */
.top .morebtn{display:none}
@media (max-width:820px){
  .top .morebtn{display:inline-block}
  .top:not(.open) .more-item{display:none!important}
  .top.open .more-item{flex:1 1 calc(50% - 8px);text-align:center}
  .top.open .more-item.editonly{display:none}
  body.edit-on .top.open .more-item.editonly{display:inline-block}
  .notice{padding:8px 12px;font-size:13px}
}
.rf-v{white-space:pre-wrap;font-size:13px}.rf-v.pos{font-size:14px}
.rf-i{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;font-size:13px;width:11em;background:#fff;color:var(--ink)}
.cover{display:none}
.cov{margin-top:8px;font-size:12.5px}.cov td:nth-child(2),.cov td:nth-child(3){white-space:nowrap}
.cov tr.none td{color:var(--muted)}
.sweep{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:2px 0 12px}
.sweep .btn{min-height:44px}.sweep .btn[aria-disabled="true"]{opacity:.55;cursor:default}
.sweptchip{display:inline-block;font-size:12.5px;font-weight:700;border-radius:5px;padding:3px 9px;white-space:nowrap;background:var(--brand-lt);color:var(--brand)}
.sweep [hidden]{display:none!important}.sweepmsg{flex-basis:100%}
.sweepmsg{font-size:12.5px;color:var(--muted)}
@media print{.sweep{display:none}}
.defs{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13px;margin:4px 0 0}
.defs dt{font-weight:700}.defs dd{margin:0}
.figrefs{margin-top:8px;font-size:12.5px}.figrefs a{color:var(--brand)}
.thumbs{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.plate{margin:0 0 20px}
.plate img{display:block;max-width:100%;max-height:520px;margin:0 auto;object-fit:contain;
  border:1px solid var(--line);border-radius:6px;background:#F1F2F6}
.plate figcaption{margin-top:7px;font-size:13px}
.plate .fp{color:var(--muted);font-size:12px}
.rf-i.cap{display:block;width:100%;margin-top:6px}
.rf-v.cap{margin-top:4px}
.rf-t:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.tf-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:3px 8px;
  color:var(--muted);background:var(--bg)}
.tag b{color:var(--ink)}
.schband td{background:var(--brand-lt);font-weight:700;color:var(--brand);
  font-family:Verdana,Geneva,sans-serif;font-size:12.5px}
@media print{
  .rf-t{border:none;padding:0;resize:none;background:none;min-height:0}
  .rf-hint,.tf-select{display:none!important}
  .mx td button.sel{border-color:transparent}
  .mx td button{padding:9px 4px}
  .flagitem,.card,.tile{break-inside:avoid}
}
/* ---- Print layout: cover page, page flow, no split findings ---- */
@media print{
  .report2,.report2 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pg.report2{max-width:none;padding:0;margin:0}
  .report2 .cover{display:flex;flex-direction:column;justify-content:center;min-height:235mm;
    break-after:page;page-break-after:always}
  .cv-co{font-family:Verdana,Geneva,sans-serif;color:var(--brand);font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:28mm}
  .cover h1{font-family:Verdana,Geneva,sans-serif;color:var(--brand);font-size:34px;line-height:1.15;margin-bottom:6mm}
  .cv-site{font-size:22px;margin-bottom:14mm}
  .cv-meta{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;font-size:14px;margin-bottom:12mm}
  .cv-meta dt{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
  .cv-meta dd{margin:0}
  .report2 > h2,.report2 > .crumb{display:none}      /* the cover replaces the on-screen title block */
  .scope-photo{display:none}                          /* the photo is on the cover */
  .rf-i{border:none;padding:0;width:auto;background:none}
  .report2 label[for="rf-revision"],.report2 .rf:has(.rf-t:placeholder-shown),
  .report2 .rf-t:placeholder-shown{display:none!important}
  .report2 .rf-i:placeholder-shown{display:none}
  .report2 .card.flow{break-inside:auto}               /* long lists must be allowed to flow */
  .report2 .card.newpage{break-before:page}
  .report2 h3,.report2 h4,.report2 .secbreak{break-after:avoid}
  .report2 .rep-table thead{display:table-header-group}
  .report2 .rep-table tr{break-inside:avoid}
  .report2 .schband{break-after:avoid}
  .report2 .jstage,.report2 .qphoto{break-inside:avoid}
  .report2 .thumbs{display:none}                       /* photos are referenced by figure number and printed as plates */
  .report2 .plate{break-inside:avoid;margin-bottom:7mm}
  .report2 .plate img{max-height:100mm}
  .report2 .rf-i.cap:placeholder-shown{display:none}
  .report2 .rf-l{break-after:avoid}
  body{font-size:12.5px}
}
@media (max-width:720px){
  .mx .zl{display:none}
  .tf-row{gap:7px}
}
</style>

const JOURNEY_PLAN=[
 ["ENTER",1,"Entrances","Getting through the door — principal and additional pedestrian entrances."],
 ["MOVE AROUND",1,"Internal Accessways","Moving through the building — internal accessways and floor and ground surfaces."],
 ["AMENITIES",3,"Accessible Toilets","Sanitary facilities — accessible, ambulant and adult change facilities."],
 ["BE INFORMED",4,"Signage","Finding the way and knowing what is happening — signage and wayfinding."]

 "ARRIVE":["Getting to and into the building — car parking, landscaping, kerb ramps, external accessways, TGSIs, ramps, external stairs and entrances.","Getting to the building — car parking, landscaping, kerb ramps, external accessways, TGSIs, ramps and external stairs."],
 "JOIN IN":["Using and participating in the building — service areas, internal paths of travel, meeting spaces, hearing augmentation, amenities and signage.","Using and participating in the building — service areas, meeting spaces, hearing augmentation and kitchen, dining and canteen areas."]
};
const isDivider=t=>p=>p.divider&&p.title.trim().toUpperCase()===t;

/* Returns how many dividers were added. */
function applyJourney(pages,newId){
 let added=0;
 const find=f=>pages.findIndex(f), byTitle=t=>find(p=>!p.divider&&p.title===t);
 const pull=t=>{const i=byTitle(t);return i<0?null:pages.splice(i,1)[0];};
 const mk=([t,pri,,blurb])=>({id:newId(),title:t,divider:true,blurb,pri,items:[]});
 const plan=Object.fromEntries(JOURNEY_PLAN.map(x=>[x[0],x]));
 /* existing dividers: give them an explicit priority, refresh a blurb only if it is still the old default */
 Object.entries(OLD_BLURBS).forEach(([t,[oldB,newB]])=>{
  const d=pages.find(isDivider(t)); if(!d) return;
  if(!validPri(d.pri)) d.pri=t==="ARRIVE"?1:2;
  if(d.blurb===oldB) d.blurb=newB;
 });
 /* ENTER: just before Entrances */
 if(!pages.some(isDivider("ENTER"))){
  const i=find(p=>!p.divider&&p.title.toLowerCase().includes("entrances"));
  if(i>=0){ pages.splice(i,0,mk(plan["ENTER"])); added++; }
 }
 /* MOVE AROUND: internal accessways + floor surfaces move ahead of JOIN IN */
 if(!pages.some(isDivider("MOVE AROUND"))){
  const ia=byTitle("Internal Accessways");
  if(ia>=0){
   const moved=["Internal Accessways","Floor / Ground Surfaces"].map(pull).filter(Boolean);
   let at=find(isDivider("JOIN IN")); if(at<0) at=find(p=>p.title==="Customer Service Areas"); if(at<0) at=Math.min(ia,pages.length);
   pages.splice(at,0,mk(plan["MOVE AROUND"]),...moved); added++;
  }
 }
 /* AMENITIES: before the first accessible toilet page */
 if(!pages.some(isDivider("AMENITIES"))){
  const i=find(p=>!p.divider&&p.title.toLowerCase().includes("accessible toilets"));
  if(i>=0){ pages.splice(i,0,mk(plan["AMENITIES"])); added++; }
 }
 /* BE INFORMED: Signage moves to the end of the journey, ahead of LEAVE */
 if(!pages.some(isDivider("BE INFORMED"))&&byTitle("Signage")>=0){
  const sg=pull("Signage");
  let at=find(isDivider("LEAVE")); if(at<0) at=find(p=>p.title==="Access Consultant Declaration"); if(at<0) at=pages.length;
  pages.splice(at,0,mk(plan["BE INFORMED"]),sg); added++;

/* One notice per id; calling again replaces it. level: "warn" | "err". */
function notice(id,html,level){

   Result is kept in PERSIST and stated plainly whenever it is not granted. */
let PERSIST="unknown";   // "granted" | "refused" | "unsupported"
async function checkPersistence(){
 const st=navigator.storage;
 if(!st||!st.persist||!st.persisted){
  PERSIST="unsupported";
 }else{
  try{ PERSIST=(await st.persisted()||await st.persist())?"granted":"refused"; }
  catch(e){ PERSIST="refused"; }
 }
 if(PERSIST==="granted"){ clearNotice("persist"); return; }
 notice("persist",`<b>Storage not protected.</b> This browser ${PERSIST==="refused"?"refused":"does not support"}
   persistent storage, so it may delete this audit and its photos — Safari does so after 7 days without a visit.
   Keep a backup file of every audit.`,"warn");
}
/* A save that fails silently is worse than one that refuses (design brief).

 const w=Object.keys(SAVE_FAIL);
 if(!w.length){ clearNotice("savefail"); return; }
 const full=w.some(k=>SAVE_FAIL[k]==="full");
 notice("savefail",`<b>Not saved.</b> Your latest ${esc(w.join(" and "))} could not be stored — this browser's storage
   ${full?"is full":"is unavailable (private browsing or blocked)"}. What is on screen will be lost if this page closes.

 Object.keys(PHOTOS).forEach(k=>{ if(res.some(re=>re.test(k))){ PHOTOS[k].forEach(p=>IDB.del(p.id).catch(()=>{})); delete PHOTOS[k]; } });
}
function pageScore(pg){
 let got=0,max=0,hi=0,med=0,brc=0;
 allQs().filter(x=>x.page===pg).forEach(x=>{
   const set=RS(x.item.rs).opts; if(!isScored(set))return;
   max++; const v=S[x.key];
   if(v!==undefined&&v!==""){const o=set[+v]; if(o){ if(o.score===1)got++; if(o.flag){ if(o.breach)brc++; else if(o.score===0)hi++; else med++; } }}
 });
 return {got,max,hi,med,brc};
}
function totals(){
 let got=0,max=0,flag=0,ans=0,n=0;
 allQs().forEach(x=>{const set=RS(x.item.rs).opts;const v=S[x.key];n++;
   if(v!==undefined&&v!=="")ans++;
   if(isScored(set)){max++; if(v!==undefined&&v!==""){const o=set[+v];if(o){if(o.score===1)got++;}}}
   if(v!==undefined&&v!==""){const o=set[+v];if(o&&o.flag)flag++;}
 });
 return {got,max,flag,ans,n};
}
/* Find a field's item id by page + label. Uses Array.some() so a match
   found in a nested call short-circuits every enclosing loop too — a plain
   recursive "return" only exits its own call, letting the search keep
   going and a later same-labelled field silently overwrite an earlier
   correct match. */
function getFieldKey(pageTitle,label){
 const pg=T.pages.find(p=>p.title===pageTitle); if(!pg)return null;
 let foundId=null;
 (function look(arr){
  return arr.some(it=>{
   if(it.t===label&&(it.k==="txt"||it.k==="dt"||it.k==="q"||it.k==="media")){foundId=it.id;return true;}
   if(it.items)return look(it.items);
   return false;
  });
 })(pg.items);
 return foundId;
}
function getFieldVal(pageTitle,label){
 const id=getFieldKey(pageTitle,label);
 const v=id?(S[id]||""):"";
 /* date fields are stored as yyyy-mm-dd; show them the way the report is read */
 return /^\d{4}-\d{2}-\d{2}$/.test(v)?v.split("-").reverse().join("/"):v;
}

/* =====================================================================
   ON-SITE PHOTOS
   Each audit item can hold photos taken on the device camera. Photos are
   compressed in the browser and stored in IndexedDB on this device only —
   nothing is uploaded to a server. They stay attached to their item and
   appear in the report. Keyed by the same answer key as comments/scores.
===================================================================== */
let PHOTOS={};                         // key -> [{id,key,data,ts}]
let photoKey=null;                     // item awaiting a capture
const IDB=(function(){
 let dbp=null;
 function open(){
  if(dbp)return dbp;
  dbp=new Promise((res,rej)=>{
   const r=indexedDB.open("iac-audit-photos",1);
   r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("photos")){const os=db.createObjectStore("photos",{keyPath:"id"});os.createIndex("key","key",{unique:false});}};
   r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return dbp;
 }
 function tx(mode){return open().then(db=>db.transaction("photos",mode).objectStore("photos"));}
 return {
  all:()=>tx("readonly").then(os=>new Promise(res=>{const q=os.getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);})),
  /* Resolves null once the transaction has committed, or the error if it did not. */
  put:rec=>tx("readwrite").then(os=>new Promise(res=>{
    const t=os.transaction; let err=null;
    t.oncomplete=()=>res(null);
    t.onabort=()=>res(err||t.error||new Error("aborted"));
    const q=os.put(rec); q.onerror=()=>{err=q.error;};
  })).catch(e=>e||new Error("unavailable")),
  del:id=>tx("readwrite").then(os=>new Promise(res=>{const q=os.delete(id);q.onsuccess=()=>res();q.onerror=()=>res();})),
  clear:()=>tx("readwrite").then(os=>new Promise(res=>{const q=os.clear();q.onsuccess=()=>res();q.onerror=()=>res();}))
 };
})();
async function loadPhotos(){
 PHOTOS={};
 try{(await IDB.all()).forEach(r=>{(PHOTOS[r.key]=PHOTOS[r.key]||[]).push(r);});}catch(e){}
}
/* Shrink a captured image so many photos fit within device storage. */
function compressImage(file,max=1400,quality=0.7){
 return new Promise(res=>{
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{
   let w=img.naturalWidth,h=img.naturalHeight;
   if(w>h&&w>max){h=Math.round(h*max/w);w=max;}
   else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
   const c=document.createElement("canvas");c.width=w;c.height=h;
   c.getContext("2d").drawImage(img,0,0,w,h);
   URL.revokeObjectURL(url);
   try{res(c.toDataURL("image/jpeg",quality));}catch(e){res(null);}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);res(null);};
  img.src=url;
 });
}

/* =====================================================================
   SWEEP TO PASS (design brief, P1 on-site capture)
   Most answers in a real audit are "complies". One control per Legislative
   Requirements group marks every UNANSWERED question Pass, so the auditor
   then taps only the exceptions. Guards:
   - it never overwrites an existing answer, so a recorded finding is safe;
   - each question it sets is marked S[key+"|sw"]="1": "passed by sweep", not
     assessed item by item. The mark is cleared the moment the auditor touches
     that question, and the report states how many answers came from sweeps;
   - Undo sweep puts those questions back to unanswered.
===================================================================== */
const passIdx=()=>String(RS("phml").opts.findIndex(o=>o.score===1));
const sweepKeys=card=>[...card.querySelectorAll('[role="radiogroup"][aria-labelledby]')].map(g=>g.querySelector("[data-q]").dataset.q);
const isSwept=k=>S[k+"|sw"]==="1"&&S[k]===passIdx();
function sweepHTML(it,suf){
 if(!/legislative/i.test(it.t)) return "";
 const qs=[]; walkQs(it.items,suf,qs,null);
 const keys=qs.filter(x=>x.item.rs==="phml"&&!String(x.key).includes("|addl")).map(x=>x.key);
 if(!keys.length) return "";
 const un=keys.filter(k=>S[k]===undefined||S[k]==="").length, sw=keys.filter(isSwept).length;
 return `<div class="sweep"><button type="button" class="btn" data-sweepgo aria-disabled="${!un}">${un?`Mark ${un} remaining as Pass`:"Nothing left to sweep"}</button>
  <button type="button" class="btn" data-sweepundo ${sw?"":"hidden"}>Undo sweep</button>
  <span class="sweptchip" data-sweepchip ${sw?"":"hidden"}>Swept · ${sw} of ${keys.length}</span>
  <span class="sweepmsg" role="status" data-sweepmsg></span></div>`;
}
function refreshSweep(card,msg){
 const ctl=card&&card.querySelector(".sweep"); if(!ctl) return;
 const keys=sweepKeys(card), un=keys.filter(k=>S[k]===undefined||S[k]==="").length, sw=keys.filter(isSwept).length;
 const go=ctl.querySelector("[data-sweepgo]");
 go.textContent=un?`Mark ${un} remaining as Pass`:"Nothing left to sweep"; go.setAttribute("aria-disabled",String(!un));
 ctl.querySelector("[data-sweepundo]").hidden=!sw;
 const chip=ctl.querySelector("[data-sweepchip]"); chip.hidden=!sw; chip.textContent=`Swept · ${sw} of ${keys.length}`;
 if(msg!==undefined) ctl.querySelector("[data-sweepmsg]").textContent=msg;
}
function sweepGroup(card,undo){
 const keys=sweepKeys(card), pass=passIdx(); let n=0;
 keys.forEach(k=>{
  if(undo){ if(isSwept(k)){ delete S[k]; delete S[k+"|sw"]; n++; } }
  else if(S[k]===undefined||S[k]===""){ S[k]=pass; S[k+"|sw"]="1"; n++; }
  const g=card.querySelector(`[data-q="${CSS.escape(k)}"]`); if(g) syncRadioGroup(g.closest('[role="radiogroup"]'),S[k]);
 });
 saveA(); renderNav(); renderTop(); updatePageScore();
 refreshSweep(card,undo?`Sweep undone: ${n} item${n===1?"":"s"} cleared.`:`${n} item${n===1?"":"s"} marked Pass by sweep.`);
}

/* Priority options are a radio group (WCAG 1.3.1 / 4.1.2): the group is named by its question,
   each button reports aria-checked, and only one button is in the tab order (roving tabindex).
   Clicking the selected option still clears it, as before. */
const qlId=key=>"ql-"+String(key).replace(/\|/g,"-p-").replace(/[^\w-]/g,"_");
function radioGroup(key,set,v,nameAttr){
 const sel=v!==undefined&&v!==""&&set[+v]?String(v):null;
 return `<div class="opts" role="radiogroup" ${nameAttr}>`+set.map((o,j)=>{
  const on=sel===String(j), tab=sel===null?j===0:on;
  return `<button type="button" role="radio" aria-checked="${on}" tabindex="${tab?0:-1}" class="opt ${o.cls} ${on?"on":""}" data-q="${key}" data-v="${j}">${esc(o.l)}</button>`;
 }).join("")+`</div>`;
}
function syncRadioGroup(group,v){
 const btns=[...group.querySelectorAll('[role="radio"]')];
 const has=v!==undefined&&v!==""&&btns.some(b=>b.dataset.v===v);
 btns.forEach((b,i)=>{
  const on=has&&b.dataset.v===v;
  b.classList.toggle("on",on); b.setAttribute("aria-checked",on?"true":"false");
  b.tabIndex=(has?on:i===0)?0:-1;
 });
}

/* =====================================================================
   REPORT v2 — journey-ordered, two-axis findings report.
   Drop-in replacement for reportHTML(). Paste this block immediately
   ABOVE the existing `function reportHTML(){` and DELETE the old
   function body (from `function reportHTML(){` down to the closing
   `return h+`</div></div>`;\n}`).

   Storage: adds S[key+"|diff"], S[key+"|impact"], S[key+"|action"].

/* --- 1. Journey sections ---------------------------------------------
   Priority is a PROPERTY OF THE PAGE, set once in the template editor
   (see editor-priority.js). A divider sets the priority for its whole
   section; an individual page can override it — a Lifts page sitting
   inside a late section is still path of travel.

   Priority answers "where in the visitor's journey", never "how bad".
   Severity already carries that on the other axis, so a non-compliant
   adult change facility stays priority 3 and takes its weight from the
   Breach of Code classification instead.

   SECTION_PRI is now only a fallback, used for dividers whose priority
   has not been set yet. First match wins, so specific rows come first. */
const SECTION_PRI=[
 [/amenit|toilet|sanitary|\bwc\b|shower|change|ablution/i,                3],
 [/sign|wayfind|be informed|communicat|inform/i,                          4],
 [/arriv|park|approach|external|kerb|landscap/i,                          1],
 [/enter|entra|door|foyer|lobby/i,                                        1],
 [/move around|circulat|accessway|corridor|floor|surface|ramp|stair|lift|handrail/i, 1],
 [/leave|egress|evacuat|emergenc|refuge/i,                                1],
 [/join in|particip|service|counter|reception|seating|hearing|kitchen/i,  2]
];
const PRI_LABEL={1:"Path of travel",2:"Services & participation",
                 3:"Amenities",4:"Information & other"};
const PRI_OPTIONS=[[1,"1 \u00b7 Path of travel"],[2,"2 \u00b7 Services & participation"],
                   [3,"3 \u00b7 Amenities"],[4,"4 \u00b7 Information & other"]];

const validPri=v=>(v>=1&&v<=4)?+v:0;
function fallbackPri(title){
 const hit=SECTION_PRI.find(([re])=>re.test(title||""));
 return hit?hit[1]:2;
}
/* page.id -> {section, pri, secPri}. Rebuilt each render so edits apply. */
function sectionMap(){
 const m=new Map(); let sec="General", pri=2;
 T.pages.forEach(p=>{
  if(p.divider){
   sec=p.title;
   pri=validPri(p.pri)||fallbackPri(p.title);
   return;
  }
  m.set(p.id,{section:sec,secPri:pri,pri:validPri(p.pri)||pri});
 });
 return m;
}

/* --- 2. Effort & scheduling zone ------------------------------------ */
const DIFFS=[["low","Low effort"],["mod","Moderate"],["high","High / capital"]];
const DIFF_LABEL=Object.fromEntries(DIFFS);
function zoneOf(pri,diff){
 const early=pri<=2;
 if(diff==="low") return early?1:3;
 if(diff==="mod") return early?2:3;
 if(diff==="high")return early?3:4;
 return early?2:3;              // effort not yet set
}
const ZONE=[null,
 {k:"z1",l:"Do first",   sub:"Immediate"},
 {k:"z2",l:"Programme",  sub:"This budget cycle"},
 {k:"z3",l:"Plan",       sub:"Design & approval needed"},
 {k:"z4",l:"Monitor",    sub:"Act at next refurbishment"}];

/* --- 3. Collect every flagged finding, with its derived metadata ----- */
function collectFindings(){
 const map=sectionMap();
 /* position of each section in the journey, so findings sort by journey order within a priority */
 const secOrder=[]; map.forEach(v=>{ if(!secOrder.includes(v.section)) secOrder.push(v.section); });
 return allQs().map(x=>{
  const v=S[x.key], set=RS(x.item.rs).opts;
  if(v===undefined||v===""||!set[+v]) return null;
  const o=set[+v];
  const meta=map.get(x.page&&x.page.id)||{section:"General",pri:2};
  const gc = o.breach?"br"
           : o.score===0?"hi"
           : /med/i.test(o.l)?"md"
           : /low/i.test(o.l)?"lo"
           : o.flag?"md":"pass";
  return {
   key:x.key, item:x.item, page:x.page, opt:o, flag:!!o.flag,
   gc, gl:o.l, section:meta.section, pri:meta.pri, secIdx:Math.max(0,secOrder.indexOf(meta.section)),
   diff:S[x.key+"|diff"]||"", impact:S[x.key+"|impact"]||"",
   action:S[x.key+"|action"]||"", note:S[x.key+"|n"]||"",
   zone:zoneOf(meta.pri,S[x.key+"|diff"]||"")
  };
 }).filter(Boolean);
}

/* --- 4b. Photo plates: figure numbers ---------------------------------
   Every photo attached to a flagged finding, then every other item that has
   one, gets a Figure number in the order it appears in the report. Findings
   and the works schedule refer to figures; the plates themselves are the
   large photographs at the end. Numbering ignores the on-screen matrix
   filter, so a figure keeps its number whatever is being viewed. */
function buildFigures(all){
 const RK={br:0,hi:1,md:2,lo:3,pass:9};

 const no=new Map(), list=[];
 const add=(key,item,page,label)=>(PHOTOS[key]||[]).forEach(p=>{
  if(no.has(p.id)) return;
  no.set(p.id,list.length+1);
  list.push({n:list.length+1,p,key,title:item.t,page:page?page.title:"",label});
 });
 flags.forEach(f=>add(f.key,f.item,f.page,f.gl));
 const fk=new Set(flags.map(f=>f.key));
 allQs().filter(x=>!fk.has(x.key)).forEach(x=>add(x.key,x.item,x.page,"Comment"));
 return {no,list};
}

       <span class="tag">When <b>${z.l}</b></span>
     </div>

 }
 h+=`</div>`;

 /* ---- Works schedule ---- */
 h+=`<div class="card flow newpage"><h3>Works schedule</h3>
   <p class="rf-hint">The hand-off table. Export this as CSV beside the PDF so the client can paste it

 /* ---- Monitor list (unchanged behaviour) ---- */

   ${S[x.key+"|n"]?`<div class="rf-note"><b>Comment:</b> ${esc(S[x.key+"|n"])}</div>`:""}
   ${figRefs(x.key)}</div>`;

 h+=`</div>`;                          // close the "other items" card
 /* ---- Photographic record (plates) ---- */
 if(FIG.list.length){

 }
 return h+`</div>`;

/* Build a fully self-contained HTML report (photos embedded inline) and
   download it. Opens cleanly in any browser and prints to PDF. The report
   also carries its own tiny "Edit this report" toggle (contentEditable) +
   "Save edited copy" button, so whoever receives the file can correct
   wording or add a note directly in the report and re-save it, without
   needing this tool at all. Both controls are hidden from print/PDF. */
/* Turn the live report into finished client copy: auditor guidance
   (.rf-hint) is removed, and every <select> becomes plain text of its
   chosen option. A select with nothing chosen is removed, together with
   its "Fix by:" label when it has one. */
function flattenForExport(html){
 const t=document.createElement("template"); t.innerHTML=html;
 t.content.querySelectorAll(".rf-hint").forEach(n=>n.remove());
 t.content.querySelectorAll("select").forEach(sel=>{
  const opt=sel.querySelector("option[selected]");
  const host=sel.closest("label")||sel;
  if(!opt||!opt.value){ host.remove(); return; }
  const span=document.createElement("span");
  span.className="tag";
  if(sel.hasAttribute("data-diff")) span.innerHTML="Effort <b></b>";
  else if(sel.hasAttribute("data-tf")) span.innerHTML="Fix by <b></b>";
  else span.innerHTML="<b></b>";
  span.querySelector("b").textContent=opt.textContent;
  host.replaceWith(span);
 });
 return t.innerHTML;
}
/* Ctrl+P / "Print / PDF" in the report view prints the same flattened
   document the export produces: chosen values as text, no dropdowns, no
   auditor guidance. The live (editable) report is put back afterwards. */
let PRINT_SWAPPED=false;
window.addEventListener("beforeprint",()=>{
 if(mode!=="report"||PRINT_SWAPPED) return;
 PRINT_SWAPPED=true;
 EXPORTING=true; try{ document.getElementById("content").innerHTML=flattenForExport(reportHTML()); } finally { EXPORTING=false; }
});
window.addEventListener("afterprint",()=>{
 if(!PRINT_SWAPPED) return;
 PRINT_SWAPPED=false; render();
});

function newQ(){return {k:"q",id:genId(),t:"New question",c:"",rs:"phml"};}
function newBlock(kind){
 switch(kind){
  case "std":return {k:"std",id:genId(),opts:["AS1428.1"]};
  case "txt":return {k:"txt",id:genId(),t:"Details:",multi:true};
  case "field":return {k:"txt",id:genId(),t:"New field",multi:false};
  case "grp":return {k:"grp",id:genId(),t:"Legislative Requirements",addl:2,items:[newQ()]};
  case "sec":return {k:"sec",id:genId(),t:"Element",rep:true,items:[{k:"txt",id:genId(),t:"Details:",multi:true},{k:"grp",id:genId(),t:"Legislative Requirements",addl:2,items:[newQ()]}]};
  case "card":return {k:"card",id:genId(),t:"Sub-section",items:[]};
  case "inst":return {k:"inst",id:genId(),t:"Instruction",body:"Enter text…"};
 }
}
function op(act,id){
 const acts={
  up:()=>{const l=findLoc(id);if(l&&l.i>0){[l.arr[l.i-1],l.arr[l.i]]=[l.arr[l.i],l.arr[l.i-1]];}},
  down:()=>{const l=findLoc(id);if(l&&l.i<l.arr.length-1){[l.arr[l.i+1],l.arr[l.i]]=[l.arr[l.i],l.arr[l.i+1]];}},
  del:()=>{if(confirm("Delete this item and its answers?")){const l=findLoc(id);if(l){const ids=[];collectIdsDeep(l.item,ids);purgeAnswersForIds(ids);l.arr.splice(l.i,1);}}},
  addq:()=>{itemsArrayOf(id).push(newQ());},
  addgrp:()=>{itemsArrayOf(id).push(newBlock("grp"));},
  addtxt:()=>{itemsArrayOf(id).push(newBlock("txt"));},
  addstd:()=>{itemsArrayOf(id).push(newBlock("std"));},
  addsec:()=>{itemsArrayOf(id).push(newBlock("sec"));},
  addcard:()=>{itemsArrayOf(id).push(newBlock("card"));},
  addinst:()=>{itemsArrayOf(id).push(newBlock("inst"));},
  addfield:()=>{itemsArrayOf(id).push(newBlock("field"));},
 };
 if(acts[act]){acts[act]();saveT();render();}
}
function pageOp(act){
 if(act==="pup"&&cur>0){[T.pages[cur-1],T.pages[cur]]=[T.pages[cur],T.pages[cur-1]];cur--;}
 else if(act==="pdown"&&cur<T.pages.length-1){[T.pages[cur+1],T.pages[cur]]=[T.pages[cur],T.pages[cur+1]];cur++;}
 else if(act==="pdel"){if(T.pages.length>1&&confirm("Delete this whole page?")){T.pages.splice(cur,1);if(cur>=T.pages.length)cur=T.pages.length-1;}}
 else if(act==="addpage"){T.pages.push({id:"pg"+genId(),title:"New Page",divider:false,blurb:"",items:[]});cur=T.pages.length-1;}
 saveT();saveA();render();
}

/* =====================================================================
   BACKUP & RESTORE  (design brief, P0 — data durability)
   One JSON file holds everything needed to rebuild an audit on a clean
   browser: answers, report fields, photos (already base64 JPEG) and the
   template the answer keys belong to. It lives in Downloads, outside the
   browser storage that can be evicted.
   Format: {format:"iac-audit-backup", schemaVersion, createdAt, site,
            complete, answers:{s,r,cur}, photos:[...], template}
===================================================================== */
const BKEY="iac_backup_v1", BACKUP_SCHEMA=1;
let BK={sig:"",at:0,complete:false};   // sig = fingerprint of the audit at last backup
try{const b=JSON.parse(localStorage.getItem(BKEY)); if(b&&typeof b==="object") BK={...BK,...b};}catch(e){}
const saveBK=()=>{try{localStorage.setItem(BKEY,JSON.stringify(BK))}catch(e){}};

/* Fingerprint of everything a backup contains that the auditor can change.
   Key-sorted so merely re-ordering keys never looks like an edit. */
function stableStr(v){
 if(Array.isArray(v)) return "["+v.map(stableStr).join(",")+"]";
 if(v&&typeof v==="object") return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+stableStr(v[k])).join(",")+"}";
 return JSON.stringify(v===undefined?null:v);
}
function auditSig(){
 const ids=[]; Object.keys(PHOTOS).forEach(k=>PHOTOS[k].forEach(p=>ids.push(p.id)));
 const str=stableStr([S,REPS,ids.sort()]); let h=5381;
 for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0;
 return (h>>>0).toString(36)+"."+str.length;
}
const hasAuditData=()=>Object.keys(S).length>0||Object.keys(REPS).length>0||Object.values(PHOTOS).some(l=>l.length);
const fmtDate=ts=>new Date(ts).toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"short"});
const countAnswers=s=>Object.keys(s).filter(k=>!k.includes("|")&&s[k]!==""&&s[k]!==undefined).length;
const pl=(n,w)=>n+" "+w+(n===1?"":"s");
const countPhotos=()=>Object.values(PHOTOS).reduce((n,l)=>n+l.length,0);

async function downloadBackup(){
 /* Union of what is on screen and what is stored, so a photo that failed
    to save to IndexedDB still goes into the backup file. */
 const byId=new Map(); try{(await IDB.all()).forEach(p=>byId.set(p.id,p));}catch(e){}
 Object.values(PHOTOS).flat().forEach(p=>byId.set(p.id,p));
 const site=getFieldVal("Title Page","Site conducted")||"";
 const data={format:"iac-audit-backup",schemaVersion:BACKUP_SCHEMA,createdAt:new Date().toISOString(),
   site,complete:!!BK.complete,answers:{s:S,r:REPS,cur},
   photos:[...byId.values()],template:T};
 const name="audit-backup-"+(site.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"untitled")+
   "-"+new Date().toISOString().slice(0,10)+".json";
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));
 a.download=name; document.body.appendChild(a); a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
 BK.sig=auditSig(); BK.at=Date.now(); saveBK();
 clearNotice("backup");
 notice("backupok",`<b>Backup downloaded:</b> ${esc(name)} — ${pl(countAnswers(S),"answer")}, ${pl(countPhotos(),"photo")}.
   Check your Downloads folder; the browser cannot confirm the file was kept.`,"ok");
 return name;
}
/* Called on load and after a backup/restore. */
function checkBackupStale(){
 if(!hasAuditData()||auditSig()===BK.sig){ clearNotice("backup"); return; }
 notice("backup",`<b>Not backed up.</b> This audit has changes that are not in a backup file
   (${BK.at?"last backed up "+esc(fmtDate(BK.at)):"never backed up"}).
   <button type="button" class="btn" data-act="backup">Back up now</button>`,"warn");
}
/* Back up on the natural end-of-audit moments, but only if something changed. */
function autoBackupIfChanged(){ if(hasAuditData()&&auditSig()!==BK.sig) downloadBackup(); }

async function restoreFromFile(file){
 let b;
 try{ b=JSON.parse(await file.text()); }catch(e){ alert("That file is not a readable backup (it is not valid JSON). Nothing was changed."); return; }
 if(!b||b.format!=="iac-audit-backup"){ alert("That file is not an audit backup. Nothing was changed.\n\n(An exported template or report cannot be restored here.)"); return; }
 if(!Number.isInteger(b.schemaVersion)||b.schemaVersion>BACKUP_SCHEMA){
  alert("This backup was made by a newer version of the tool (format "+b.schemaVersion+"). Update the tool before restoring it. Nothing was changed."); return; }
 const a=b.answers;
 if(!a||typeof a.s!=="object"||a.s===null||!Array.isArray(b.photos)){ alert("This backup file is damaged (answers or photos are missing). Nothing was changed."); return; }
 const photos=b.photos.filter(p=>p&&p.id&&p.key&&typeof p.data==="string"&&p.data.startsWith("data:image/"));
 const dropped=b.photos.length-photos.length;
 const hasT=!!(b.template&&Array.isArray(b.template.pages));
 const dirty=hasAuditData()&&auditSig()!==BK.sig;
 const msg=`Restore this backup?\n\nSite: ${b.site||"(not named)"}\nSaved: ${b.createdAt?new Date(b.createdAt).toLocaleString("en-AU"):"unknown"}\n`+
   `Contents: ${pl(countAnswers(a.s),"answer")}, ${pl(photos.length,"photo")}${dropped?` (${dropped} unreadable will be skipped)`:""}${hasT?", and the template":""}\n\n`+
   `This REPLACES the audit currently in the tool${hasT?" and its template":""}.`+
   (dirty?"\nThe current audit has changes that are not backed up, so a backup of it will be downloaded first.":"");
 if(!confirm(msg)) return;
 if(dirty) await downloadBackup();
 S=a.s; REPS=(a.r&&typeof a.r==="object")?a.r:{}; cur=Number.isInteger(a.cur)?a.cur:0;
 if(hasT){ T=b.template; if(!T.meta) T.meta={title:"Premises Access Audit",nextId:99999}; saveT(); }
 if(cur>=T.pages.length||cur<0) cur=0;
 saveA();
 try{ await IDB.clear(); for(const p of photos){ const er=await IDB.put(p); if(er){ saveFailed("photos",er); break; } } }catch(e){}
 await loadPhotos();
 BK.sig=auditSig(); BK.at=b.createdAt?Date.parse(b.createdAt)||Date.now():Date.now(); BK.complete=!!b.complete; saveBK();
 clearNotice("backup"); clearNotice("backupok");
 render(); updateDoneBtn();
 const got=countPhotos();
 notice("backupok",`<b>Backup restored:</b> ${pl(countAnswers(S),"answer")}, ${pl(got,"photo")}${got<photos.length?` — only ${got} of ${photos.length} could be written`:""}.`,got<photos.length?"err":"ok");
}

/* Reset audit: a confirm() becomes muscle memory by the fiftieth audit, so
   the auditor must type the site name (or RESET if none is entered). */
function resetModal(){
 const site=(getFieldVal("Title Page","Site conducted")||"").trim();
 const word=site||"RESET";
 const norm=x=>x.trim().replace(/\s+/g," ").toLowerCase();
 const dlg=document.createElement("dialog"); dlg.className="resetdlg"; dlg.setAttribute("aria-labelledby","resetTitle");
 const status=()=>!hasAuditData()?"There is nothing in this audit yet."
   :auditSig()===BK.sig?`This audit matches its last backup (${esc(fmtDate(BK.at))}).`
   :`<b>This audit is not backed up.</b> ${BK.at?"Last backed up "+esc(fmtDate(BK.at))+".":"It has never been backed up."}`;
 dlg.innerHTML=`<h3 id="resetTitle">Reset this audit?</h3>
  <p>This permanently deletes <b>${pl(countAnswers(S),"answer")}</b>, all notes and report text, and
     <b>${pl(countPhotos(),"photo")}</b> from this device. The template is kept. It cannot be undone.</p>
  <p role="status" data-st>${status()}</p>
  <button type="button" class="btn" data-bk>Back up first</button>
  <label for="resetConfirm">To confirm, type <b>${esc(word)}</b></label>
  <input id="resetConfirm" class="ein" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="rsact"><button type="button" class="btn" data-cancel>Cancel</button>
   <button type="button" class="btn danger" data-go disabled>Reset audit</button></div>`;
 document.body.appendChild(dlg);
 const inp=dlg.querySelector("#resetConfirm"), go=dlg.querySelector("[data-go]");
 const ok=()=>norm(inp.value)===norm(word);
 inp.oninput=()=>{go.disabled=!ok();};
 inp.onkeydown=e=>{ if(e.key==="Enter"&&ok()){ e.preventDefault(); go.click(); } };
 dlg.querySelector("[data-cancel]").onclick=()=>dlg.close();
 dlg.querySelector("[data-bk]").onclick=async()=>{ const n=await downloadBackup();
   dlg.querySelector("[data-st]").innerHTML=`<b>Backup downloaded:</b> ${esc(n)}`; };
 go.onclick=()=>{
  if(!ok()) return;
  dlg.close();
  S={};REPS={};cur=0;saveA();
  BK.sig="";BK.complete=false;saveBK();updateDoneBtn();clearNotice("backup");clearNotice("backupok");
  IDB.clear().then(()=>{PHOTOS={};saveOK("photos");render();}).catch(()=>{PHOTOS={};render();});
 };
 dlg.addEventListener("close",()=>dlg.remove());
 dlg.showModal(); inp.focus();
}

/* ---------------------------------------------------------------------
   ADD LEAVE SECTION to a template that was saved before it existed.
   Additive only: nothing is changed or renumbered, so no saved answer is
   affected. New pages and questions get fresh ids from genId(). Safe to
   run twice (it does nothing if a LEAVE divider is already there).
--------------------------------------------------------------------- */
const hasLeave=()=>T.pages.some(p=>p.divider&&p.title.trim().toUpperCase()==="LEAVE");
function addLeaveSection(){
 if(hasLeave()) return false;
 const fresh=it=>{ const o=clone(it); o.id=genId();
   if(o.k==="fnn"){o.k="q";o.rs="fnn";if(o.c===undefined)o.c=null;}
   if(o.k==="q"&&!o.rs) o.rs="phml";
   if(Array.isArray(o.items)) o.items=o.items.map(fresh); return o; };
 const add=LEAVE_PAGES.map(p=>({id:"pg"+genId(),title:p.title,divider:!!p.divider,blurb:p.blurb||"",pri:p.pri||0,
   items:(p.items||[]).map(fresh)}));
 let at=T.pages.findIndex(p=>p.title==="Access Consultant Declaration"); if(at<0) at=T.pages.length;
 T.pages.splice(at,0,...add);
 saveT(); try{localStorage.removeItem(LEAVE_DISMISS);}catch(e){}
 clearNotice("leave"); render();
 return true;
}
function addJourneySections(){
 if(!journeyMissing(T.pages).length) return false;
 applyJourney(T.pages,()=>"pg"+genId());
 saveT(); try{localStorage.removeItem(JOURNEY_DISMISS);}catch(e){}
 clearNotice("journey"); render();
 return true;
}
const JOURNEY_DISMISS="iac_journey_offer_dismissed";
function offerJourney(){
 let gone=false; try{gone=!!localStorage.getItem(JOURNEY_DISMISS);}catch(e){}
 const miss=journeyMissing(T.pages);
 if(!miss.length||gone) return;
 notice("journey",`<b>Journey sections missing:</b> ${esc(miss.join(", "))}. Adding them also moves Internal Accessways,
   Floor / Ground Surfaces and Signage so the report reads in the order a visitor moves. Answers are not affected.
   <button type="button" class="btn" data-act="addjourney">Add journey sections</button>`,"warn");
 document.querySelector('#notices [data-notice="journey"] .nx').addEventListener("click",()=>{
  try{localStorage.setItem(JOURNEY_DISMISS,"1");}catch(e){} });
}
const LEAVE_DISMISS="iac_leave_offer_dismissed";
function offerLeave(){
 let gone=false; try{gone=!!localStorage.getItem(LEAVE_DISMISS);}catch(e){}
 if(hasLeave()||gone) return;
 notice("leave",`<b>New: LEAVE section.</b> This template has no emergency-egress pages. Add them (draft questions, 3 pages) —
   existing answers are not affected.
   <button type="button" class="btn" data-act="addleave">Add LEAVE section</button>`,"warn");
 document.querySelector('#notices [data-notice="leave"] .nx').addEventListener("click",()=>{
  try{localStorage.setItem(LEAVE_DISMISS,"1");}catch(e){} });
}

 /* Report view and Export report are the other end-of-audit moments. */
 document.getElementById("btnReport").addEventListener("click",()=>{ if(mode==="report") autoBackupIfChanged(); });
 document.getElementById("btnExport").addEventListener("click",autoBackupIfChanged);
})();

/* Top bar: on narrow screens every button except Sections and Report view moves behind "More". */
(function(){
 const top=document.querySelector(".top"), rep=document.getElementById("btnReport");
 top.querySelectorAll(".btn").forEach(b=>{ if(b.id!=="btnMenu"&&b.id!=="btnReport") b.classList.add("more-item"); });
 const more=document.createElement("button"); more.type="button"; more.className="btn morebtn"; more.id="btnMore";
 more.textContent="More ▾"; more.setAttribute("aria-expanded","false"); more.setAttribute("aria-controls","topbar");
 top.id="topbar"; rep.after(more);
 const set=o=>{ top.classList.toggle("open",o); more.setAttribute("aria-expanded",String(o)); more.textContent=o?"Less ▴":"More ▾"; };
 more.onclick=()=>set(!top.classList.contains("open"));
 /* choosing an action closes the menu; Escape closes it and returns focus to the button */
 top.addEventListener("click",e=>{ if(e.target.closest(".more-item")) set(false); });
 top.addEventListener("keydown",e=>{ if(e.key==="Escape"&&top.classList.contains("open")){ set(false); more.focus(); } });
})();

loadAll();
render();
checkPersistence();
offerLeave();
offerJourney();
loadPhotos().then(()=>{render();checkBackupStale();});   // re-render once photos are read from IndexedDB
</script>
